[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha"
version = "0.1.0"
description = "US equity cross-sectional multi-factor research framework"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
yfinance = ["yfinance>=0.2"]
dev = ["pytest>=7"]

[project.scripts]
alpha = "alpha.cli:main"

[tool.setuptools.packages.find]
include = ["alpha*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
